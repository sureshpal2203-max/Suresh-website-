<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suresh Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f7ff;
      color: #222;
      text-align: center;
    }

    header {
      background: #1769ff;
      color: white;
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 15px;
    }

    p {
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: white;
      color: #1769ff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    section {
      padding: 40px 20px;
    }

    .card {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    footer {
      background: #111;
      color: white;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Welcome to Suresh Website 👋</h1>
    <p>My Personal Website</p>
    <a class="button" href="#about">Explore</a>
  </header>

  <section id="about">
    <div class="card">
      <h2>About Me</h2>
      <p>Hello! This is my personal website. 🚀</p>
    </div>

    <div class="card">
      <h2>My Projects</h2>
      <p>My projects and ideas will be displayed here.</p>
    </div>
  </section>

  <footer>
    <p>© 2026 Suresh Website</p>
  </footer>

</body>
</html>

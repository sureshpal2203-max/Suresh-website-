<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suresh's Website</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  line-height:1.6;
}

header{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);
}

.hero{
  max-width:700px;
}

.hero h1{
  font-size:48px;
  margin-bottom:15px;
}

.hero h1 span{
  color:#60a5fa;
}

.hero p{
  font-size:20px;
  color:#cbd5e1;
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  padding:14px 25px;
  margin:7px;
  border-radius:30px;
  text-decoration:none;
  color:white;
  background:#2563eb;
  transition:.3s;
}

.btn:hover{
  transform:scale(1.05);
  background:#3b82f6;
}

section{
  padding:70px 20px;
  text-align:center;
}

section h2{
  font-size:35px;
  margin-bottom:25px;
}

.about{
  max-width:800px;
  margin:auto;
  color:#cbd5e1;
  font-size:18px;
}

.cards{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  max-width:1000px;
  margin:auto;
}

.card{
  width:280px;
  padding:30px;
  border-radius:20px;
  background:#1e293b;
